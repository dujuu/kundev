@let m = member();

<div class="team-avatar">
  @if (m.photo) {
    <img [src]="m.photo" [alt]="m.name" loading="lazy" />
  } @else {
    <span class="team-avatar-initials" aria-hidden="true">{{ m.initials }}</span>
  }
</div>

<h3 class="team-name">{{ m.name }}</h3>
<span class="team-divider" aria-hidden="true">{{ '{' }} • {{ '}' }}</span>
<p class="team-role">{{ m.role }}</p>

@if (m.linkedin || m.email) {
  <div class="team-links">
    @if (m.linkedin) {
      <a [href]="m.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn de {{ m.name }}">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6" />
          <path d="M7.5 10v6.5M7.5 7.5v.01M11.5 16.5V13c0-1.4 1-2.3 2.3-2.3 1.2 0 1.9.9 1.9 2.3v3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </a>
    }
    @if (m.email) {
      <a [href]="'mailto:' + m.email" aria-label="Correo de {{ m.name }}">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.6" />
          <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    }
  </div>
}
